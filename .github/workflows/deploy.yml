name: Build and deploy to GitHub Pages

# Cada push a la rama principal reconstruye y publica la web.
# Tarda alrededor de un minuto; puedes seguirlo en la pestana "Actions" del repo.
on:
  push:
    branches: [master, main]
  workflow_dispatch: # permite lanzarlo a mano desde la interfaz de GitHub

permissions:
  contents: read
  pages: write
  id-token: write

# Si haces varios push seguidos, cancela los builds antiguos y publica solo el ultimo.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
